openapi: 3.0.3
info:
  title: Ktor Users API
  version: 2.0.0
  description: API with PostgreSQL, JWT authentication, roles and WebSocket notifications.
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      summary: API information
      responses:
        '200': { description: API links }
  /swagger:
    get:
      summary: Swagger UI
      responses:
        '200': { description: Swagger UI page }
  /openapi.yaml:
    get:
      summary: OpenAPI specification
      responses:
        '200': { description: OpenAPI YAML document }
  /api/health:
    get:
      summary: Health check
      responses:
        '200': { description: Service is healthy }
  /api/auth/register:
    post:
      summary: Register a USER account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201': { description: Account created; returns JWT }
        '409': { description: Username already exists }
  /api/auth/login:
    post:
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200': { description: JWT token }
        '401': { description: Invalid credentials }
  /api/users/me:
    get:
      summary: Get own profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Own profile }
        '401': { description: Unauthorized }
    put:
      summary: Update own username
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
      responses:
        '200': { description: Updated profile; emits USER_UPDATED WebSocket event }
  /api/users:
    get:
      summary: List all users (ADMIN only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User list }
        '403': { description: Admin role required }
  /api/users/{id}:
    delete:
      summary: Delete user (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted; emits USER_DELETED WebSocket event }
        '403': { description: Admin role required }
  /ws/notifications:
    get:
      summary: WebSocket notifications
      description: Connect via ws://localhost:8080/ws/notifications. Receives USER_UPDATED and USER_DELETED JSON events.
      responses:
        '101': { description: WebSocket protocol upgrade }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 80 }
        password: { type: string, minLength: 8 }
