openapi: 3.0.3
info:
  title: Ktor Users API
  version: 1.0.0
  description: REST API for basic user management.
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/users:
    get:
      summary: Get all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get user by ID
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      summary: Delete user by ID
      responses:
        '204': { description: User deleted }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Alex }
        email: { type: string, format: email, example: alex@example.com }
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: Alex }
        email: { type: string, format: email, example: alex@example.com }
    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: USER_NOT_FOUND }
        message: { type: string, example: User with id=99 was not found }
